---
- name: Create project directory
  file:
    path: "{{ jenkins_docker_path }}"
    state: directory
    mode: '0755'

- name: Render docker-compose configuration
  template:
    src: docker-compose.yaml.j2
    dest: "{{ jenkins_docker_path }}/docker-compose.yaml"
    mode: '0644'

- name: Render docker configuration
  template:
    src: Dockerfile.j2
    dest: "{{ jenkins_docker_path }}/Dockerfile"
    mode: '0644'

- name: Render docker configuration
  template:
    src: plugins.j2
    dest: "{{ jenkins_docker_path }}/plugins.txt"
    mode: '0644'

- name: Start Jenkins using Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ jenkins_docker_path }}"
    state: present
    build: always