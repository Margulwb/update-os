- name: Create jenkins group on host
  become: true
  group:
    name: jenkins
    gid: 1004
    state: present

- name: Create jenkins user on host
  become: true
  user:
    name: jenkins
    uid: 1004
    group: jenkins
    state: present

- name: Ensure jenkins-data directory has correct ownership
  file:
    path: /home/mg/jenkins-data
    state: directory
    owner: 1004
    group: 1004
    mode: '0755'