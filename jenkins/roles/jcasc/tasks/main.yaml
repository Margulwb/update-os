---
- name: Create project directory
  file:
    path: "{{ jenkins_project_path }}"
    state: directory
    mode: '0755'

- name: Render JCasC configuration from template
  template:
    src: casc.yaml.j2
    dest: "{{ jenkins_project_path }}/casc.yaml"
    mode: '0644'

