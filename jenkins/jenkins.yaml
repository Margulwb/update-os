- name: Setup Docker for Jenkins
  hosts: jenkins_server
  vars_files:
    - group_vars/all.yaml
  roles:
    - docker
  tags:
    - docker
    
- name: Setup Jenkins with JCasC
  hosts: jenkins_server
  vars_files:
    - group_vars/secrets/jenkins.yml
    - group_vars/all.yaml
  roles:
    - jcasc
  tags:
    - jcasc
    